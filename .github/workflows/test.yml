# ĐTCL Coach v1.0 (2026-10-06) — tự chạy kiểm thử mỗi lần đẩy mã lên GitHub
name: Kiem thu
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -rfE -p no:cacheprovider > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          # đưa kết quả thành ghi chú (annotation) để đọc được qua API
          grep -E "^(FAILED|ERROR) " /tmp/out.txt | head -9 | while IFS= read -r l; do echo "::error title=test::${l//$'\n'/ }"; done
          msg=$(grep -E "^(E |tests/|[A-Za-z]+Error)" /tmp/out.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          [ $code -ne 0 ] && echo "::error title=chi tiet::$msg"
          echo "::notice title=ket qua::$(tail -1 /tmp/out.txt)"
          exit $code
